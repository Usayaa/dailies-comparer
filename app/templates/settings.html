{% extends "base.html" %}
{% block title %}{{ _("settings_title") }}{% endblock %}
{% block content %}
  <section class="card narrow">
    <h1>{{ _("settings_title") }}</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="form" value="preferences">
      <label>{{ _("language") }}
        <select name="language">
          {% for code, name in LANGUAGES.items() %}
            <option value="{{ code }}" {{ "selected" if current_user.language == code }}>{{ name }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="check">
        <input type="checkbox" name="hide_spoilers" {{ "checked" if current_user.hide_spoilers }}>
        {{ _("hide_spoilers") }}
      </label>
      <p class="small muted">{{ _("hide_spoilers_help") }}</p>
      <button type="submit">{{ _("save") }}</button>
    </form>
  </section>

  <section class="card narrow">
    <h2>{{ _("change_password") }}</h2>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="form" value="password">
      <label>{{ _("current_password") }}<input type="password" name="current_password" autocomplete="current-password" required></label>
      <label>{{ _("new_password") }}<input type="password" name="new_password" autocomplete="new-password" minlength="8" required></label>
      <button type="submit">{{ _("change_password") }}</button>
    </form>
  </section>
{% endblock %}
